<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Graph · EDGE Note</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="/edge-note-mark.v3.svg">
  <link rel="icon" type="image/png" sizes="192x192" href="/edge-note-icon-v3-192.png">
  <link rel="apple-touch-icon" href="/edge-note-icon-v3-512.png">
  <link rel="preload" href="/fonts/newsreader-latin-opsz-normal.woff2" as="font" type="font/woff2" crossorigin>
  <meta name="theme-color" content="#0b1524">
  <style>
    @font-face {
      font-family: "Schibsted Grotesk"; font-style: normal; font-display: swap; font-weight: 400 900;
      src: url("/fonts/schibsted-grotesk-latin-wght-normal.woff2") format("woff2-variations");
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
    }
    @font-face {
      font-family: "Newsreader"; font-style: normal; font-display: swap; font-weight: 200 800;
      src: url("/fonts/newsreader-latin-opsz-normal.woff2") format("woff2-variations");
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --stage:      #0b1524;
      --field:      #0e1a2b;
      --glass:      #121f36;
      --glass-2:    #1b2b46;
      --line:       rgba(255,255,255,.08);
      --text:       #e9edf5;
      --text-2:     #c9d1de;
      --text-dim:   #a3aec0;
      --accent:     #4d74ff;
      --accent-ink: #7d99ff;
      --serif: "Newsreader", "AppleMyungjo", "Noto Serif KR", "Nanum Myeongjo", Georgia, serif;
      --sans:  "Schibsted Grotesk", "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --dock-w: 96px;
      --head-h: 116px;
    }

    html, body {
      height: 100%;
      background: var(--stage);
      color: var(--text);
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }
    button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
    a { color: inherit; text-decoration: none; }
    :focus-visible { outline: 2px solid var(--accent-ink); outline-offset: 2px; }

    /* ── Dock ── */
    .dock {
      position: fixed; top: 40px; left: 18px; z-index: 120;
      display: flex; flex-direction: column; align-items: center; gap: 6px;
      width: 62px; padding: 12px 8px;
      background: var(--glass); border: 1px solid var(--line); border-radius: 22px;
      box-shadow: 0 30px 60px -30px rgba(0,0,0,.75);
    }
    .dock-brand { display: grid; place-items: center; margin-bottom: 6px; }
    .dock-brand img { width: 34px; height: 34px; border-radius: 10px; }
    .dock-btn {
      position: relative; display: grid; place-items: center;
      width: 44px; height: 44px; border-radius: 14px; color: var(--text-dim);
      transition: background .14s, color .14s;
    }
    .dock-btn:hover { background: rgba(255,255,255,.07); color: #fff; }
    .dock-btn.active, .dock-btn[aria-current="page"] { background: rgba(255,255,255,.1); color: #fff; }
    .dock-btn[aria-current="page"]::before {
      content: ""; position: absolute; left: -8px; top: 14px;
      width: 3px; height: 16px; border-radius: 2px; background: var(--accent);
    }
    .dock-btn svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .dock-sep { width: 24px; height: 1px; margin: 4px 0; background: var(--line); }
    .dock-btn::after {
      content: attr(data-label); position: absolute; left: calc(100% + 12px); top: 50%;
      transform: translateY(-50%); padding: 4px 8px; border-radius: 8px;
      background: var(--glass-2); color: #fff; font-size: 12px; font-weight: 600; white-space: nowrap;
      pointer-events: none; opacity: 0; transition: opacity .14s;
    }
    .dock-btn:hover::after, .dock-btn:focus-visible::after { opacity: 1; }

    /* ── Header ── */
    .graph-head {
      position: fixed; top: 0; left: var(--dock-w); right: 24px; height: var(--head-h); z-index: 100;
      display: flex; flex-wrap: nowrap; align-items: flex-end; justify-content: space-between;
      gap: 10px 24px; padding: 0 0 18px 8px;
    }
    .graph-head-text { min-width: 0; flex: 1 1 auto; }
    .graph-eyebrow { font-size: 12px; font-weight: 600; letter-spacing: .09em; color: var(--text-dim); }
    .graph-title {
      margin-top: 4px;
      font-family: var(--serif); font-size: 40px; font-weight: 500; letter-spacing: -.02em; line-height: 1.05;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .graph-chips { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; max-width: 46%; max-height: 72px; overflow: hidden; }
    .chip {
      display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px;
      border-radius: 999px; border: 1px solid var(--line); font-size: 13px; color: var(--text-2);
    }
    .chip-solid { background: rgba(255,255,255,.1); border-color: transparent; color: var(--text); }
    .chip-dot { width: 8px; height: 8px; border-radius: 50%; flex: 0 0 auto; }

    /* ── Field ── */
    .field {
      position: fixed; top: var(--head-h); left: var(--dock-w); right: 24px; bottom: 24px;
      background: var(--field); border: 1px solid rgba(255,255,255,.06); border-radius: 22px;
      overflow: hidden;
    }
    #graph-canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
    #graph-stats { position: absolute; left: 18px; bottom: 14px; font-size: 12px; color: var(--text-dim); pointer-events: none; }

    .node-label { font-family: var(--sans); paint-order: stroke; stroke: var(--field); stroke-width: 4px; stroke-linejoin: round; }
    .node-label.is-focal { font-family: var(--serif); }
    @keyframes halo { 0%, 100% { opacity: .5; } 50% { opacity: .9; } }
    .focal-halo { animation: halo 3.2s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) { .focal-halo { animation: none; } }

    /* ── Note card (hover preview, click to pin) ── */
    #note-card {
      position: absolute; right: 20px; bottom: 20px; z-index: 20;
      width: 300px; max-height: calc(100% - 40px); overflow-y: auto;
      padding: 16px;
      background: rgba(18,31,54,.94); border: 1px solid var(--line); border-radius: 16px;
      box-shadow: 0 20px 50px -20px rgba(0,0,0,.75);
      opacity: 0; transform: translateY(8px); pointer-events: none;
      transition: opacity .16s, transform .16s;
    }
    #note-card.show { opacity: 1; transform: none; pointer-events: auto; }
    .nc-title { display: flex; align-items: baseline; gap: 8px; font-family: var(--serif); font-size: 19px; font-weight: 500; line-height: 1.2; }
    .nc-title .chip-dot { transform: translateY(-2px); }
    .nc-meta { margin-top: 4px; font-size: 12px; color: var(--text-dim); }
    .nc-snippet { margin: 10px 0 0; font-size: 13px; line-height: 1.5; color: var(--text-dim); }
    .nc-snippet:empty { display: none; }
    .nc-conns { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--line); }
    .nc-conns:empty { display: none; }
    .nc-conns-label { font-size: 11px; font-weight: 600; letter-spacing: .08em; color: var(--text-dim); margin-bottom: 4px; }
    .nc-conn {
      display: flex; align-items: center; gap: 8px; width: 100%; padding: 6px 0; text-align: left;
      font-size: 13px; color: var(--text-2);
    }
    .nc-conn:hover { color: #fff; }
    .nc-conn span:nth-child(2) { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .nc-conn small { color: var(--text-dim); font-size: 11px; }
    .nc-actions { display: flex; gap: 8px; margin-top: 14px; }
    .nc-open {
      display: inline-flex; align-items: center; height: 34px; padding: 0 14px; border-radius: 10px;
      background: #fff; color: #0e1a2b; font-size: 13.5px; font-weight: 600;
    }
    .nc-open:hover { background: #e9edf5; }
    .nc-focus {
      display: inline-flex; align-items: center; height: 34px; padding: 0 12px; border-radius: 10px;
      border: 1px solid var(--line); font-size: 13px; color: var(--text-2);
    }
    .nc-focus:hover { background: rgba(255,255,255,.07); color: #fff; }
    .nc-hint { margin-top: 10px; font-size: 11px; color: var(--text-dim); }

    /* ── Filter drawer ── */
    #filter-panel {
      position: absolute; top: 12px; left: 12px; bottom: 12px; z-index: 30; width: 268px;
      background: var(--glass); border: 1px solid var(--line); border-radius: 18px;
      box-shadow: 0 30px 60px -30px rgba(0,0,0,.8);
      overflow-y: auto;
      opacity: 0; transform: translateX(-12px); pointer-events: none;
      transition: opacity .18s, transform .18s;
    }
    #filter-panel.open { opacity: 1; transform: none; pointer-events: auto; }
    .fp-section { padding: 16px 18px; border-bottom: 1px solid var(--line); }
    .fp-section:last-child { border-bottom: 0; }
    .fp-section-label { font-size: 11px; font-weight: 600; letter-spacing: .08em; color: var(--text-dim); margin-bottom: 12px; }
    .fp-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 12px; }
    .fp-row:last-child { margin-bottom: 0; }
    .fp-label { font-size: 13px; color: var(--text-2); white-space: nowrap; }
    .fp-slider-wrap { display: flex; align-items: center; gap: 8px; }
    .fp-slider { width: 100px; accent-color: var(--accent); cursor: pointer; }
    .fp-slider-val { min-width: 26px; text-align: right; font-size: 12px; color: var(--text); font-variant-numeric: tabular-nums; }
    .fp-toggle { position: relative; width: 34px; height: 20px; flex: 0 0 auto; }
    .fp-toggle input { position: absolute; opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; z-index: 1; }
    .fp-toggle-track { position: absolute; inset: 0; border-radius: 10px; background: rgba(255,255,255,.14); transition: background .2s; }
    .fp-toggle input:checked + .fp-toggle-track { background: var(--accent); }
    .fp-toggle input:focus-visible + .fp-toggle-track { outline: 2px solid var(--accent-ink); outline-offset: 2px; }
    .fp-toggle-track::after {
      content: ""; position: absolute; top: 3px; left: 3px; width: 14px; height: 14px;
      border-radius: 50%; background: #fff; transition: transform .2s;
    }
    .fp-toggle input:checked + .fp-toggle-track::after { transform: translateX(14px); }
    .fp-search {
      width: 100%; height: 36px; padding: 0 12px; border-radius: 10px;
      background: rgba(255,255,255,.06); border: 1px solid var(--line);
      color: var(--text); font: inherit; font-size: 13px; outline: none;
    }
    .fp-search:focus { border-color: var(--accent-ink); }
    .fp-search::placeholder { color: var(--text-dim); }
    .fp-nb-list { display: flex; flex-direction: column; gap: 8px; }
    .fp-nb-item { display: flex; align-items: center; gap: 9px; font-size: 13px; color: var(--text-2); cursor: pointer; }
    .fp-nb-item input { accent-color: var(--accent); cursor: pointer; }
    .fp-empty { font-size: 12px; color: var(--text-dim); }

    /* ── Loading / empty ── */
    #loading {
      position: fixed; inset: 0; z-index: 300; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 12px; background: var(--stage);
      color: var(--text-dim); font-size: 13px;
    }
    .spinner { width: 28px; height: 28px; border: 3px solid rgba(255,255,255,.12); border-top-color: var(--accent); border-radius: 50%; animation: spin .7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    #empty-state {
      position: absolute; left: 50%; bottom: 22%; transform: translateX(-50%);
      display: none; max-width: 320px; text-align: center; font-size: 13px; line-height: 1.5;
      color: var(--text-dim); pointer-events: none;
    }

    /* ── Phone ── */
    .head-actions { display: none; }
    @media (max-width: 700px) {
      :root { --head-h: 104px; }
      .dock { display: none; }
      .graph-head { left: 12px; right: 12px; padding: 0 0 12px; align-items: flex-end; flex-wrap: nowrap; }
      .graph-head-text { flex: 1; }
      .graph-title { max-width: none; font-size: 28px; }
      .graph-chips { display: none; }
      .head-actions { display: flex; gap: 4px; flex: 0 0 auto; }
      .head-actions .dock-btn { width: 42px; height: 42px; background: var(--glass); border: 1px solid var(--line); }
      .head-actions .dock-btn::after { display: none; }
      .field { left: 10px; right: 10px; bottom: calc(10px + env(safe-area-inset-bottom)); border-radius: 20px; }
      #note-card { left: 10px; right: 10px; bottom: 10px; width: auto; max-height: 60%; }
      #filter-panel { left: 10px; right: 10px; width: auto; }
    }
  </style>
</head>
<body>

<nav class="dock" aria-label="Dock">
  <a class="dock-brand" href="/" data-internal-app-link aria-label="EDGE Note">
    <img src="/edge-note-mark.v3.svg" alt="" width="34" height="34">
  </a>
  <a class="dock-btn" href="/" data-internal-app-link data-label="Back to notes" aria-label="Back to notes">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5"/><path d="m12 5-7 7 7 7"/></svg>
  </a>
  <a class="dock-btn" href="/graph.html" aria-current="page" data-label="Graph" aria-label="Graph">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 13.5 6.8 4M15.4 6.5l-6.8 4"/></svg>
  </a>
  <span class="dock-sep" aria-hidden="true"></span>
  <button class="dock-btn" id="btn-filters" type="button" data-label="Filters" aria-label="Filters" aria-expanded="false" aria-controls="filter-panel">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M7 12h10M10 18h4"/></svg>
  </button>
  <button class="dock-btn" id="btn-reset-zoom" type="button" data-label="Fit graph" aria-label="Fit graph">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
  </button>
</nav>

<header class="graph-head">
  <div class="graph-head-text">
    <p class="graph-eyebrow">LOCAL GRAPH</p>
    <h1 class="graph-title" id="graph-title">Graph</h1>
  </div>
  <div class="graph-chips" id="graph-chips"></div>
  <div class="head-actions">
    <a class="dock-btn" href="/" data-internal-app-link aria-label="Back to notes">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5"/><path d="m12 5-7 7 7 7"/></svg>
    </a>
    <button class="dock-btn" id="mobile-filters" type="button" aria-label="Filters" aria-controls="filter-panel">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M7 12h10M10 18h4"/></svg>
    </button>
    <button class="dock-btn" id="mobile-fit" type="button" aria-label="Fit graph">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
    </button>
  </div>
</header>

<main class="field" aria-label="Graph of linked notes">
  <svg id="graph-canvas" role="img" aria-label="Notes linked to the focal note"></svg>
  <div id="graph-stats"></div>
  <p id="empty-state">No linked notes yet. Link a note with @ or give two notes a shared tag and they connect here.</p>

  <aside id="note-card" aria-live="polite">
    <div class="nc-title"><span class="chip-dot" id="nc-dot"></span><span id="nc-title"></span></div>
    <div class="nc-meta" id="nc-meta"></div>
    <p class="nc-snippet" id="nc-snippet"></p>
    <div class="nc-conns" id="nc-conns"></div>
    <div class="nc-actions">
      <button class="nc-open" id="nc-open" type="button">Open note</button>
      <button class="nc-focus" id="nc-focus" type="button">Center here</button>
    </div>
    <p class="nc-hint" id="nc-hint"></p>
  </aside>

  <div id="filter-panel" aria-label="Graph filters">
    <div class="fp-section">
      <div class="fp-section-label">JUMP TO</div>
      <input class="fp-search" id="fp-note-search" type="search" placeholder="Find a note…" autocomplete="off" spellcheck="false">
    </div>
    <div class="fp-section">
      <div class="fp-section-label">SHOW</div>
      <div class="fp-row">
        <span class="fp-label">Steps out</span>
        <div class="fp-slider-wrap">
          <input class="fp-slider" type="range" id="sl-depth" min="1" max="5" value="2" step="1" aria-label="Steps out">
          <span class="fp-slider-val" id="val-depth">2</span>
        </div>
      </div>
      <div class="fp-row">
        <span class="fp-label">Unlinked notes</span>
        <label class="fp-toggle"><input type="checkbox" id="tog-orphans" aria-label="Show unlinked notes"><span class="fp-toggle-track"></span></label>
      </div>
      <div class="fp-row">
        <span class="fp-label">Link labels</span>
        <label class="fp-toggle"><input type="checkbox" id="tog-link-labels" aria-label="Show link labels"><span class="fp-toggle-track"></span></label>
      </div>
    </div>
    <div class="fp-section">
      <div class="fp-section-label">SPACES</div>
      <div class="fp-nb-list" id="fp-nb-list"><span class="fp-empty">Loading…</span></div>
    </div>
    <div class="fp-section">
      <div class="fp-section-label">LAYOUT</div>
      <div class="fp-row">
        <span class="fp-label">Node size</span>
        <div class="fp-slider-wrap">
          <input class="fp-slider" type="range" id="sl-node-size" min="0.6" max="2" value="1" step="0.1" aria-label="Node size">
          <span class="fp-slider-val" id="val-node-size">1×</span>
        </div>
      </div>
      <div class="fp-row">
        <span class="fp-label">Labels from zoom</span>
        <div class="fp-slider-wrap">
          <input class="fp-slider" type="range" id="sl-text-fade" min="0" max="5" value="2" step="1" aria-label="Labels from zoom">
          <span class="fp-slider-val" id="val-text-fade">2</span>
        </div>
      </div>
      <div class="fp-row">
        <span class="fp-label">Spread</span>
        <div class="fp-slider-wrap">
          <input class="fp-slider" type="range" id="sl-repulsion" min="200" max="800" value="420" step="20" aria-label="Spread">
          <span class="fp-slider-val" id="val-repulsion">420</span>
        </div>
      </div>
    </div>
  </div>
</main>

<div id="loading"><div class="spinner"></div><span>Building graph…</span></div>

<script type="module" src="/graph.v3.js"></script>
</body>
</html>
