<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-labelledby="en-title en-desc">
  <title id="en-title">EDGE Note</title>
  <desc id="en-desc">EDGE Note app icon: stacked paper pages centered on a dark tile, red left spine, folded top-right corner, geometric E lettermark with red accent middle bar.</desc>

  <!--
    Tile:        1024×1024, rx=230
    Paper front: w=560 h=640, centered → x=232 y=192
    Stack mid:   offset -12,-12 → x=220 y=180
    Stack back:  offset -20,-20 → x=212 y=172
    Spine:       x=232 w=32 (left edge of front page)
    Fold:        144px triangle, top-right of front page
    E:           w=256 h=288, centered on tile (512,512) → x=384 y=368
                 bars: top y=368 h=52, mid y=488 h=48, bot y=604 h=52
                 vertical bar: x=384 w=52 h=288
                 mid bar shorter: w=184
  -->

  <!-- Dark tile background -->
  <rect width="1024" height="1024" rx="230" fill="#27272a"/>

  <!-- Page 3 — back -->
  <rect x="252" y="212" width="560" height="640" rx="36" fill="#2e2e31"/>

  <!-- Page 2 — middle -->
  <rect x="244" y="204" width="560" height="640" rx="36" fill="#37373c"/>

  <!-- Page 1 — front (centered: x=232 y=192) -->
  <rect x="232" y="192" width="560" height="640" rx="36" fill="#f7f6f3"/>

  <!-- Red left spine -->
  <rect x="232" y="192" width="32" height="640" rx="16" fill="#e8553e"/>

  <!-- Folded corner — top-right of front page -->
  <!-- Shadow triangle behind fold -->
  <path d="M648 192 L792 192 L792 336 Z" fill="#18181a" opacity="0.20"/>
  <!-- Fold face -->
  <path d="M648 192 L792 336 L648 336 Z" fill="#e2dbd4"/>
  <!-- Fold crease -->
  <path d="M648 192 L792 336" fill="none" stroke="#bfb8b0" stroke-width="3"/>

  <!-- Geometric E lettermark -->
  <!-- Vertical bar -->
  <rect x="384" y="368" width="52" height="288" rx="12" fill="#2a2a2d"/>
  <!-- Top horizontal bar -->
  <rect x="384" y="368" width="256" height="52" rx="12" fill="#2a2a2d"/>
  <!-- Middle horizontal bar — accent color, shorter -->
  <rect x="384" y="488" width="184" height="48" rx="12" fill="#e8553e"/>
  <!-- Bottom horizontal bar -->
  <rect x="384" y="604" width="256" height="52" rx="12" fill="#2a2a2d"/>
</svg>
