<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quick capture · EDGE Note</title>
  <meta name="color-scheme" content="dark">
  <style>
    @font-face {
      font-family: "Schibsted Grotesk"; font-style: normal; font-display: swap; font-weight: 400 900;
      src: url("/fonts/schibsted-grotesk-latin-wght-normal.woff2") format("woff2-variations");
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: transparent; overflow: hidden; }
    body {
      font-family: "Schibsted Grotesk", "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #e9edf5; -webkit-font-smoothing: antialiased;
      padding: 14px;
    }
    button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
    :focus-visible { outline: 2px solid #7d99ff; outline-offset: 2px; }

    .bubble {
      height: 100%; display: flex; flex-direction: column; justify-content: center; gap: 10px;
      padding: 14px 16px 12px 20px;
      background: #121f36; border: 1px solid rgba(255,255,255,.1); border-radius: 22px;
      box-shadow: 0 24px 60px -18px rgba(0,0,0,.75), 0 2px 8px rgba(0,0,0,.3);
      animation: rise 200ms cubic-bezier(.2,.7,.2,1) both;
    }
    @keyframes rise { from { opacity: 0; transform: translateY(8px) scale(.985); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { .bubble { animation: none; } }

    .row { display: flex; align-items: center; gap: 12px; }
    .mark { width: 18px; height: 15px; flex: 0 0 auto; }
    .mark rect { fill: #e9edf5; }
    .mark .mid { fill: #4d74ff; }
    #text {
      flex: 1; min-width: 0; height: 44px; border: 0; outline: 0; background: transparent;
      font: inherit; font-size: 1.2rem; color: #ffffff; caret-color: #7d99ff;
    }
    #text::placeholder { color: #75839a; }
    #add {
      height: 40px; padding: 0 16px; border-radius: 12px; background: #ffffff; color: #0e1a2b;
      font-size: .92rem; font-weight: 600; white-space: nowrap;
    }
    #add:hover:not(:disabled) { background: #e9edf5; }
    #add:disabled { opacity: .45; cursor: default; }

    .foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-left: 30px; min-height: 28px; }
    #task {
      display: inline-flex; align-items: center; gap: 7px; height: 28px; padding: 0 11px 0 8px; border-radius: 999px;
      border: 1px solid rgba(255,255,255,.12); font-size: .8rem; color: #c9d1de;
    }
    #task:hover { background: rgba(255,255,255,.06); }
    #task svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
    #task[aria-pressed="true"] { background: rgba(77,116,255,.2); border-color: rgba(125,153,255,.5); color: #ffffff; }
    .hint { font-size: .76rem; color: #75839a; white-space: nowrap; }
    .hint kbd { font: inherit; padding: 1px 5px; border-radius: 5px; background: rgba(255,255,255,.07); color: #a3aec0; }
    #status { font-size: .84rem; font-weight: 600; color: #6bd49a; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #status.err { color: #f08a7e; }
    #signin { height: 28px; padding: 0 12px; border-radius: 999px; background: rgba(255,255,255,.1); font-size: .8rem; font-weight: 600; }
    #signin:hover { background: rgba(255,255,255,.16); }
  </style>
</head>
<body>
  <form class="bubble" id="form" autocomplete="off">
    <div class="row">
      <svg class="mark" viewBox="0 0 18 15" aria-hidden="true"><rect width="18" height="3" rx="1.5"/><rect class="mid" y="6" width="12" height="3" rx="1.5"/><rect y="12" width="18" height="3" rx="1.5"/></svg>
      <input id="text" type="text" maxlength="2000" placeholder="Capture a thought, task or idea…" aria-label="Capture to today's note" spellcheck="true">
      <button id="add" type="submit" disabled>Add</button>
    </div>
    <div class="foot">
      <button id="task" type="button" aria-pressed="false" title="Add as a task (⌘↵)">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="m8.5 12.5 2.5 2.5 4.5-5"/></svg>
        Task
      </button>
      <span id="status" role="status" aria-live="polite"></span>
      <button id="signin" type="button" hidden>Open EDGE Note</button>
      <span class="hint" id="hint"><kbd>↵</kbd> add &nbsp;<kbd>esc</kbd> close</span>
    </div>
  </form>
  <script type="module" src="/capture.v1.js"></script>
</body>
</html>
